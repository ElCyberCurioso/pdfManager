<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Unir PDFs — PDF Manager</title>
  <meta name="description" content="Une varios PDFs en uno en tu navegador: ordena arrastrando, elige páginas de cada archivo y añade marcadores. Sin subir nada.">
  <meta name="theme-color" content="#E8334A">
  <link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <script src="../assets/js/theme-boot.js"></script>
  <script type="module" src="../assets/js/tools/merge.js"></script>
</head>
<body data-tool="merge">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header data-shell="header"></header>

  <main class="tool-page" id="main">
    <section data-shell="tool-header"></section>
    <noscript><div class="alert alert-warning">Esta herramienta necesita JavaScript. Todo se procesa en tu navegador.</div></noscript>

    <div class="drop-zone" id="dropZone">
      <input type="file" class="drop-zone__input">
      <i data-icon="upload" class="drop-zone__icon"></i>
      <p class="drop-zone__title">Arrastra tus PDFs aquí</p>
      <p class="drop-zone__sub">o haz clic para seleccionarlos · también puedes pegarlos con <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
    </div>

    <section id="listWrap" class="flex flex-col gap-3" aria-label="Archivos a unir">
      <div class="list-toolbar">
        <span class="list-toolbar__info" id="listInfo" aria-live="polite"></span>
        <button type="button" class="btn btn-outline btn-sm" id="addMoreBtn"><i data-icon="plus"></i>Añadir</button>
        <button type="button" class="btn btn-outline btn-sm" id="sortNameBtn" title="Ordenar alfabéticamente">A→Z</button>
        <button type="button" class="btn btn-outline btn-sm" id="reverseBtn"><i data-icon="swap"></i>Invertir</button>
        <button type="button" class="btn btn-ghost btn-sm" id="clearBtn"><i data-icon="trash"></i>Quitar todos</button>
      </div>
      <p class="form-hint">Arrastra desde <i data-icon="grip" class="icon-inline"></i> o usa las flechas para cambiar el orden. En «Páginas» puedes indicar rangos como <code>1-3, 7, 10-</code>.</p>
      <div class="file-list" id="fileList"></div>
    </section>

    <section class="options-panel" id="options" aria-labelledby="optTitle">
      <h2 class="options-panel__title" id="optTitle">Opciones</h2>
      <div class="check-list">
        <label class="check-group"><input type="checkbox" class="form-checkbox" id="optOutline" checked>
          <span>Crear un marcador por archivo<small>Facilita la navegación en el PDF resultante.</small></span></label>
        <label class="check-group"><input type="checkbox" class="form-checkbox" id="optDuplex">
          <span>Página en blanco tras documentos impares<small>Para imprimir a doble cara sin que un documento empiece en el reverso del anterior.</small></span></label>
        <label class="check-group"><input type="checkbox" class="form-checkbox" id="optDedupe" checked>
          <span>Eliminar recursos duplicados<small>Fuentes e imágenes repetidas entre archivos se guardan una sola vez.</small></span></label>
      </div>
      <div class="form-group" style="max-width:360px">
        <label class="form-label" for="outName">Nombre del archivo</label>
        <div class="input-with-unit"><input type="text" class="form-input" id="outName" value="unido" spellcheck="false"><span>.pdf</span></div>
      </div>
    </section>

    <div class="progress" id="progress" hidden>
      <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso"><div class="progress-bar"></div></div>
      <p class="progress-label"></p>
    </div>

    <div class="action-bar" id="actionBar">
      <button type="button" class="btn btn-primary btn-lg" id="runBtn" data-testid="run"><i data-icon="merge"></i>Unir PDFs</button>
    </div>

    <section id="result"></section>
  </main>

  <footer data-shell="footer"></footer>
</body>
</html>
