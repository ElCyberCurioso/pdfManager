<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Rotar PDF — PDF Manager</title>
  <meta name="description" content="Gira páginas sueltas, pares, impares o el PDF completo sin perder calidad. Todo en tu navegador.">
  <meta name="theme-color" content="#E8334A">
  <link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <script src="../assets/js/theme-boot.js"></script>
  <script type="module" src="../assets/js/tools/rotate.js"></script>
</head>
<body data-tool="rotate">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header data-shell="header"></header>

  <main class="tool-page tool-page--wide" id="main">
    <section data-shell="tool-header"></section>
    <noscript><div class="alert alert-warning">Esta herramienta necesita JavaScript. Todo se procesa en tu navegador.</div></noscript>

    <div class="drop-zone" id="dropZone">
      <input type="file" class="drop-zone__input">
      <i data-icon="upload" class="drop-zone__icon"></i>
      <p class="drop-zone__title">Arrastra tu PDF aquí</p>
      <p class="drop-zone__sub">o haz clic para seleccionarlo · también puedes pegarlo con <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
    </div>
    <div id="fileSummary"></div>

    <section id="editor" class="flex flex-col gap-4" aria-label="Páginas">
      <div class="grid-toolbar" role="toolbar" aria-label="Rotación">
        <button type="button" class="btn btn-secondary btn-sm" id="rotLeft"><i data-icon="rotateLeft"></i>90° izquierda</button>
        <button type="button" class="btn btn-secondary btn-sm" id="rotRight"><i data-icon="rotate"></i>90° derecha</button>
        <button type="button" class="btn btn-outline btn-sm" id="rot180">180°</button>
        <button type="button" class="btn btn-ghost btn-sm" id="resetRot">Restablecer</button>
        <span class="grid-toolbar__sep" aria-hidden="true"></span>
        <button type="button" class="btn btn-outline btn-sm" id="selAll">Todas</button>
        <button type="button" class="btn btn-outline btn-sm" id="selOdd">Impares</button>
        <button type="button" class="btn btn-outline btn-sm" id="selEven">Pares</button>
        <button type="button" class="btn btn-outline btn-sm" id="selNone">Ninguna</button>
      </div>
      <p class="grid-toolbar__info" id="gridInfo" aria-live="polite"></p>
      <div id="pageGrid"></div>
    </section>

    <div class="progress" id="progress" hidden>
      <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso"><div class="progress-bar"></div></div>
      <p class="progress-label"></p>
    </div>

    <div class="action-bar action-bar--sticky" id="actionBar">
      <button type="button" class="btn btn-primary btn-lg" id="runBtn" data-testid="run"><i data-icon="rotate"></i>Aplicar rotación</button>
    </div>

    <section id="result"></section>
  </main>

  <footer data-shell="footer"></footer>
</body>
</html>
