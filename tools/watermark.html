<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Marca de agua — PDF Manager</title>
  <meta name="description" content="Añade una marca de agua de texto o imagen a tu PDF con vista previa real: posición, mosaico, opacidad, rotación y capa. Sin subir archivos.">
  <meta name="theme-color" content="#E8334A">
  <link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <script src="../assets/js/theme-boot.js"></script>
  <script type="module" src="../assets/js/tools/watermark.js"></script>
</head>
<body data-tool="watermark">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header data-shell="header"></header>

  <main class="tool-page tool-page--wide" id="main">
    <section data-shell="tool-header"></section>
    <noscript><div class="alert alert-warning">Esta herramienta necesita JavaScript. Todo se procesa en tu navegador.</div></noscript>

    <div class="drop-zone" id="dropZone">
      <input type="file" class="drop-zone__input">
      <i data-icon="upload" class="drop-zone__icon"></i>
      <p class="drop-zone__title">Arrastra tu PDF aquí</p>
      <p class="drop-zone__sub">o haz clic para seleccionarlo · también puedes pegarlo con <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
    </div>
    <div id="fileSummary"></div>

    <section id="editor" class="tool-two-col">
      <div class="preview-stage sticky-col">
        <div class="preview-canvas-wrap" id="previewWrap"><canvas id="previewCanvas" aria-label="Vista previa de la página con la marca de agua" role="img"></canvas></div>
        <p class="form-error" id="previewError" role="alert" hidden></p>
        <div id="pager"></div>
      </div>

      <div class="options-panel">
        <div class="segmented" role="radiogroup" aria-label="Tipo de marca">
          <label><input type="radio" name="wmType" value="text" checked><i data-icon="text"></i>Texto</label>
          <label><input type="radio" name="wmType" value="image"><i data-icon="image"></i>Imagen</label>
        </div>

        <div id="textOpts" class="flex flex-col gap-4">
          <div class="form-group">
            <label class="form-label" for="wmText">Texto</label>
            <textarea class="form-textarea" id="wmText" rows="2" spellcheck="false">CONFIDENCIAL</textarea>
            <span class="form-hint">Admite varias líneas. Caracteres del alfabeto latino (incluye ñ, tildes y €).</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="wmFont">Fuente</label>
              <select class="form-select" id="wmFont"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="wmColor">Color</label>
              <input type="color" class="form-input" id="wmColor" value="#e8334a">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="wmSize">Tamaño</label>
            <div class="range-wrap"><input type="range" class="form-input" id="wmSize" min="8" max="200" value="60"><span class="range-value" id="wmSizeVal"></span></div>
          </div>
        </div>

        <div id="imageOpts" class="flex flex-col gap-4" hidden>
          <div class="form-group">
            <span class="form-label">Imagen (logo, sello…)</span>
            <label class="btn btn-outline btn-sm" style="width:max-content"><i data-icon="upload"></i>Elegir imagen<input type="file" id="wmImage" accept="image/*" hidden></label>
            <span class="form-hint" id="wmImageName">PNG con transparencia, JPG, WebP…</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="wmImgScale">Ancho</label>
            <div class="range-wrap"><input type="range" class="form-input" id="wmImgScale" min="5" max="100" value="40"><span class="range-value" id="wmImgScaleVal"></span></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="wmOpacity">Opacidad</label>
          <div class="range-wrap"><input type="range" class="form-input" id="wmOpacity" min="5" max="100" value="30"><span class="range-value" id="wmOpacityVal"></span></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="wmAngle">Rotación</label>
          <div class="range-wrap"><input type="range" class="form-input" id="wmAngle" min="-90" max="90" value="45"><span class="range-value" id="wmAngleVal"></span></div>
          <div class="btn-group">
            <button type="button" class="btn btn-outline btn-sm" data-angle="0">0°</button>
            <button type="button" class="btn btn-outline btn-sm" data-angle="45">45°</button>
            <button type="button" class="btn btn-outline btn-sm" data-angle="-45">−45°</button>
            <button type="button" class="btn btn-outline btn-sm" data-angle="90">90°</button>
          </div>
        </div>

        <div class="flex gap-6 flex-wrap items-center">
          <div class="form-group">
            <span class="form-label">Posición</span>
            <div class="pos-picker" role="radiogroup" aria-label="Posición">
              <label title="Arriba izquierda"><input type="radio" name="wmPos" value="top-left" aria-label="Arriba izquierda"></label>
              <label title="Arriba centro"><input type="radio" name="wmPos" value="top-center" aria-label="Arriba centro"></label>
              <label title="Arriba derecha"><input type="radio" name="wmPos" value="top-right" aria-label="Arriba derecha"></label>
              <label title="Centro izquierda"><input type="radio" name="wmPos" value="middle-left" aria-label="Centro izquierda"></label>
              <label title="Centro"><input type="radio" name="wmPos" value="center" aria-label="Centro" checked></label>
              <label title="Centro derecha"><input type="radio" name="wmPos" value="middle-right" aria-label="Centro derecha"></label>
              <label title="Abajo izquierda"><input type="radio" name="wmPos" value="bottom-left" aria-label="Abajo izquierda"></label>
              <label title="Abajo centro"><input type="radio" name="wmPos" value="bottom-center" aria-label="Abajo centro"></label>
              <label title="Abajo derecha"><input type="radio" name="wmPos" value="bottom-right" aria-label="Abajo derecha"></label>
            </div>
          </div>
          <div class="flex flex-col gap-3">
            <label class="check-group"><input type="checkbox" class="form-checkbox" id="wmTile"><span>Mosaico<small>Repite la marca por toda la página.</small></span></label>
            <div class="form-group">
              <label class="form-label" for="wmMargin">Margen</label>
              <div class="input-with-unit" style="max-width:140px"><input type="number" class="form-input" id="wmMargin" min="0" max="100" value="15"><span>mm</span></div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="wmLayer">Capa</label>
            <select class="form-select" id="wmLayer">
              <option value="over" selected>Encima del contenido</option>
              <option value="under">Debajo del contenido</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="wmPages">Páginas</label>
            <input type="text" class="form-input" id="wmPages" placeholder="Todas" spellcheck="false">
            <span class="form-hint">Ej.: <code>1-3, 8</code>, <code>pares</code>.</span>
          </div>
        </div>
      </div>
    </section>

    <div class="progress" id="progress" hidden>
      <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso"><div class="progress-bar"></div></div>
      <p class="progress-label"></p>
    </div>

    <div class="action-bar" id="actionBar">
      <button type="button" class="btn btn-primary btn-lg" id="runBtn" data-testid="run"><i data-icon="watermark"></i>Aplicar marca de agua</button>
    </div>

    <section id="result"></section>
  </main>

  <footer data-shell="footer"></footer>
</body>
</html>
