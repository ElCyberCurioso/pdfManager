# Tests en cada push / pull request y despliegue en GitHub Pages desde master.
# (Sustituye a static.yml y a deploy.yml; este último escuchaba la rama «main»,
#  que no existe en el repositorio, así que nunca se ejecutaba.)
name: CI y despliegue

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests E2E
        run: npm run test:e2e

      - name: Informe de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Solo se publica el sitio (sin tests, scripts ni configuración)
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html 404.html sw.js manifest.webmanifest tools assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
